<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>GitLab Team Pulse</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/theme-init.js"></script>
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main" title="Jump past the top bar to the page content">Skip to content</a>
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="8" class="brand-bg"/>
        <path d="M5 17h5l3-7 5 13 3-6h6" class="brand-line"/>
      </svg>
      <span class="brand-name">Team Pulse</span>
    </div>
    <nav class="tabs" aria-label="Main">
      <button type="button" class="tab" data-view="dashboard" id="tab-dashboard"
              title="Dashboard: what the monitored people work on, what needs attention and milestone progress">
        Dashboard
      </button>
      <button type="button" class="tab" data-view="teams" id="tab-teams"
              title="Teams: named groups of people and their reports over weeks, months and quarters (the number is how many teams exist)">
        Teams <span class="tab-count" id="tab-teams-count" hidden></span>
      </button>
      <button type="button" class="tab" data-view="people" id="tab-people"
              title="People: choose whom the dashboard monitors (the number is how many are selected; the choice is shared)">
        People <span class="tab-count" id="tab-people-count" hidden></span>
      </button>
    </nav>
    <div class="topbar-actions">
      <button type="button" class="icon-button" id="open-about" aria-haspopup="dialog"
              aria-controls="about" title="About">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg>
        <span class="visually-hidden">About</span>
      </button>
      <button type="button" class="icon-button" id="theme-toggle" aria-pressed="false"
              title="Toggle dark mode">
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span class="visually-hidden">Toggle dark mode</span>
      </button>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <section id="view-dashboard" class="view" aria-labelledby="dashboard-title" hidden></section>
    <section id="view-teams" class="view" aria-labelledby="teams-title" hidden></section>
    <section id="view-people" class="view" aria-labelledby="people-title" hidden></section>
  </main>

  <footer class="statusbar" id="statusbar" aria-label="Synchronization status">
    <div class="status-left" id="status-left">
      <span class="status-item">Loading status…</span>
    </div>
    <div class="status-right" id="status-right"></div>
  </footer>

  <aside id="diagnostics" class="drawer" role="dialog" aria-modal="true"
         aria-labelledby="diagnostics-title" hidden>
    <div class="drawer-panel">
      <div class="drawer-head">
        <h2 id="diagnostics-title">Diagnostics</h2>
        <button type="button" class="icon-button" id="close-diagnostics" title="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
          <span class="visually-hidden">Close diagnostics</span>
        </button>
      </div>
      <div class="drawer-body" id="diagnostics-body"></div>
    </div>
  </aside>

  <dialog id="about" class="about-dialog" aria-labelledby="about-title">
    <div class="about-head">
      <h2 id="about-title">About</h2>
      <button type="button" class="icon-button" id="close-about" title="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        <span class="visually-hidden">Close about</span>
      </button>
    </div>
    <div class="about-body" id="about-body"></div>
  </dialog>

  <dialog id="meeting" class="about-dialog meeting-dialog" aria-labelledby="meeting-title">
    <div class="about-head">
      <h2 id="meeting-title">Meeting summary</h2>
      <button type="button" class="icon-button" id="close-meeting" title="Close the meeting summary">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        <span class="visually-hidden">Close meeting summary</span>
      </button>
    </div>
    <div class="about-body" id="meeting-body"></div>
  </dialog>

  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
  <noscript><p class="noscript">GitLab Team Pulse needs JavaScript enabled.</p></noscript>
</body>
</html>
